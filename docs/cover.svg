<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">StorySiap Immersive Creative Universe</title><desc id="desc">Premium cinematic cover with flowing violet light rings on an ink-dark canvas.</desc>
<defs>
